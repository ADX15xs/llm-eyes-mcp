name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BIN="llm-eyes-mcp-${{ matrix.goos }}-${{ matrix.goarch }}"
          ARCHIVE="${BIN}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN="${BIN}.exe"
            ARCHIVE="${BIN%.exe}.zip"
            go build -ldflags "-s -w -X main.version=${VERSION}" -o "${BIN}" ./cmd/llm-eyes-mcp
            zip "${ARCHIVE}" "${BIN}"
          else
            ARCHIVE="${BIN}.tar.gz"
            go build -ldflags "-s -w -X main.version=${VERSION}" -o "${BIN}" ./cmd/llm-eyes-mcp
            tar -czf "${ARCHIVE}" "${BIN}"
          fi
          mkdir -p dist
          mv "${ARCHIVE}" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: true
